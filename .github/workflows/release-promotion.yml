name: Release promotion safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 40d4fb5a4e7549a00e1a1f9bed6e6f5cf094720c
          path: aici-policy
          persist-credentials: false
      - name: Check release shell syntax before build work
        run: |
          for script in _/build/fdroid/*.sh; do bash -n "$script"; done
      - name: Run shared positive and adversarial promotion cases
        run: bash aici-policy/release-promotion/test.sh
      - name: Test real consumer collection against mismatched inputs
        env:
          AICI_POLICY_CHECKOUT: ${{ github.workspace }}/aici-policy
        run: bash _/build/fdroid/test-release-promotion.sh
