name: Fix COPYING file mode

on:
  push:
    branches:
      - licensing/include-gplv3-text

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: licensing/include-gplv3-text
      - name: Make COPYING a normal text file and remove this one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          chmod 0644 COPYING
          rm .github/workflows/fix-copying-mode.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COPYING .github/workflows/fix-copying-mode.yml
          git commit -m 'Make COPYING a normal text file'
          git push origin HEAD:licensing/include-gplv3-text
