name: Direct DEX and JNI Android build

on:
  pull_request:
    paths:
      - '.github/workflows/direct-dex-jni.yml'
      - '.gitmodules'
      - '_deps/**'
      - 'android-direct/**'
      - 'fdroid/release-values.sh'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - 'CMakeLists.txt'
      - 'app/src/main/res/**'
      - 'app/wegert-debug.keystore'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wegert-direct-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Check out Wegert and pinned compiler sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install source-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates chezscheme libgmp-dev python3 unzip zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, packaging tools, NDK and CMake
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Generate Wegert classes.dex from pinned source
        shell: bash
        run: bash android-direct/generate-dex.sh build/direct/classes.dex

      - name: Build all native ABIs and package direct DEX APK
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          bash android-direct/build.sh build/direct/classes.dex build/direct/wegert-direct-unsigned.apk
          bash android-direct/sign-debug.sh \
            build/direct/wegert-direct-unsigned.apk \
            build/direct/wegert-direct-debug.apk

      - name: Verify JNI and NativeActivity symbols for every ABI
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for library in build/direct/native/*/libwegert.so; do
            "$readelf" -Ws "$library" > "$library.symbols"
            grep -q 'Java_org_isomorphisms_wegert_WegertActivity_jniProbe' "$library.symbols"
            grep -q 'ANativeActivity_onCreate' "$library.symbols"
          done

      - name: Retain direct-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: wegert-direct-dex-jni
          path: |
            build/direct/classes.dex
            build/direct/wegert-direct-unsigned.apk
            build/direct/wegert-direct-debug.apk
            build/direct/native/*/libwegert.so
            build/direct/native/*/libwegert.so.symbols
          if-no-files-found: error

  direct-art:
    needs: direct-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Wegert
        uses: actions/checkout@v4

      - name: Download direct APK
        uses: actions/download-artifact@v4
        with:
          name: wegert-direct-dex-jni
          path: build/direct

      - name: Execute direct DEX/JNI Wegert on ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: medium_phone
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -Eeuo pipefail
            adb install -r build/direct/wegert-direct-debug.apk
            adb logcat -c
            adb shell am start -W \
              -n org.isomorphisms.wegert/.WegertActivity \
              | tee build/direct/start.txt
            grep -q 'Status: ok' build/direct/start.txt
            for attempt in 1 2 3 4 5; do
              adb logcat -d > build/direct/logcat.txt
              if grep -q 'Wegert.*jniProbe=47047' build/direct/logcat.txt; then
                break
              fi
              sleep 1
            done
            grep -q 'Wegert.*jniProbe=47047' build/direct/logcat.txt
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            ! grep -Eiq 'VerifyError|UnsatisfiedLinkError|ClassNotFoundException' build/direct/logcat.txt

      - name: Retain ART receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wegert-direct-art
          path: |
            build/direct/start.txt
            build/direct/logcat.txt
          if-no-files-found: warn
