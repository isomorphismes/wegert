name: Render Wegert palette dances

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'code/wegert_gist_palette_dance.py'
      - '.github/workflows/render-root-videos.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'code/wegert_gist_palette_dance.py'
      - '.github/workflows/render-root-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Render actual Wegert gist palette dances
        run: python code/wegert_gist_palette_dance.py rendered_images
      - name: Make GitHub-renderable previews and real root MP4s
        shell: bash
        run: |
          set -euo pipefail
          for mp4 in rendered_images/wegert_gist_palette_dance_*.mp4; do
            gif="${mp4%.mp4}_preview.gif"
            ffmpeg -y -loglevel error -i "$mp4" \
              -filter_complex 'fps=8,scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=bayer:bayer_scale=5' \
              "$gif"
            name="$(basename "$mp4")"
            rm -f "$name"
            cp "$mp4" "$name"
          done
      - name: Put HTML5 players in README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          start = text.index('### Cubic spread:')
          end = text.index('Generator:', start)
          block = '''### Cubic spread: `(z+2.6)(z-0.7)(z-2.9)`

          <video controls preload="metadata" width="360" poster="rendered_images/wegert_gist_palette_dance_cubic_spread_preview.gif">
            <source src="wegert_gist_palette_dance_cubic_spread.mp4" type="video/mp4">
          </video>

          [MP4](wegert_gist_palette_dance_cubic_spread.mp4?raw=1)

          ### Two zeros / two poles

          <video controls preload="metadata" width="360" poster="rendered_images/wegert_gist_palette_dance_zero_pole_cross_preview.gif">
            <source src="wegert_gist_palette_dance_zero_pole_cross.mp4" type="video/mp4">
          </video>

          [MP4](wegert_gist_palette_dance_zero_pole_cross.mp4?raw=1)

          ### Five roots: `z^5 - 1`

          <video controls preload="metadata" width="360" poster="rendered_images/wegert_gist_palette_dance_fifth_roots_preview.gif">
            <source src="wegert_gist_palette_dance_fifth_roots.mp4" type="video/mp4">
          </video>

          [MP4](wegert_gist_palette_dance_fifth_roots.mp4?raw=1)

          '''
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
      - name: Commit previews and MP4s to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md \
            rendered_images/wegert_gist_palette_dance_*.mp4 \
            rendered_images/wegert_gist_palette_dance_*_preview.gif \
            wegert_gist_palette_dance_*.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Render GitHub-visible Wegert previews'
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${branch}"
