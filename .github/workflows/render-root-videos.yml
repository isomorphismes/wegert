name: Render Wegert palette dances

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'code/wegert_gist_palette_dance.py'
      - '.github/workflows/render-root-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Render actual Wegert gist palette dances
        run: python code/wegert_gist_palette_dance.py rendered_images
      - name: Commit rendered MP4s to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rendered_images/wegert_gist_palette_dance_*.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Render Wegert gist palette dances'
          git push origin "HEAD:${GITHUB_REF_NAME}"
