name: Render Wegert reference video

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'code/Wegert_g_codomain_phase.R'
      - '.github/workflows/render-root-videos.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'code/Wegert_g_codomain_phase.R'
      - '.github/workflows/render-root-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install R and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core ffmpeg
      - name: Render the original Wegert reference
        shell: bash
        run: |
          set -euo pipefail
          work='_/build/wegert_reference_render'
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          Rscript ../../../code/Wegert_g_codomain_phase.R
          cd ../../..
          cp "$work/wegert_g.png" rendered_images/wegert_g.png
          cp "$work/wegert_g_codomain_phase.mp4" rendered_images/wegert_g_codomain_phase.mp4
          cp "$work/wegert_g_codomain_phase.mp4" wegert_g_codomain_phase.mp4
          ffmpeg -y -loglevel error \
            -i rendered_images/wegert_g_codomain_phase.mp4 \
            -filter_complex 'fps=8,scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=bayer:bayer_scale=5' \
            rendered_images/wegert_g_codomain_phase_preview.gif
      - name: Commit rendered reference output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rendered_images/wegert_g.png \
            rendered_images/wegert_g_codomain_phase.mp4 \
            rendered_images/wegert_g_codomain_phase_preview.gif \
            wegert_g_codomain_phase.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Render original Wegert codomain-phase reference'
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
          done
          exit 1
