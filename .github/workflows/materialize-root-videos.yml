name: Materialize root videos

on:
  push:
    paths:
      - '_upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct MP4 files at repository root
        shell: bash
        run: |
          set -euo pipefail
          videos=(
            'pearcey-T-build-wegert-v2-small.mp4'
            'teleman-wegert-zoom-to-six.mp4'
            'theta_mellin_wegert_02.mp4'
            'wegert-k-loop.mp4'
            'wegertR_cubic_precomposition.mp4'
            'wegert_g_codomain_phase.mp4'
            'wegert_meromorphic_15s.mp4'
            'wegert_three_zero_polynomial_unit_circle.mp4'
          )
          for video in "${videos[@]}"; do
            cat "_upload/${video}.b64."* | base64 --decode > "$video"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.mp4'
          git rm -r _upload
          git rm .github/workflows/materialize-root-videos.yml
          git commit -m 'Put Wegert videos at repository root'
          git push
