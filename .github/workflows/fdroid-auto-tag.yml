name: Tag tested F-Droid release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main-branch source with a committed physical acceptance record
        required: true
        type: string
      android_run_id:
        description: Successful main-branch Android run for source_sha
        required: true
        type: string
      fdroid_run_id:
        description: Successful main-branch F-Droid run containing the exact tested candidate
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: wegert-release-publication
  cancel-in-progress: false
jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ANDROID_RUN_ID: ${{ inputs.android_run_id }}
      FDROID_RUN_ID: ${{ inputs.fdroid_run_id }}
    steps:
      - name: Reject non-main dispatch before reading candidate data
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 118e2be79b2d527c20887b47a466c73e05491ace
          path: aici-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Collect actual F-Droid candidate and successful source-bound runs
        env:
          GH_TOKEN: ${{ github.token }}
          AICI_POLICY_CHECKOUT: ${{ github.workspace }}/aici-policy
        run: bash _/build/fdroid/collect-release-context.sh "$RUNNER_TEMP/release-evidence"
      - name: Require committed exact-APK acceptance before any tag write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-evidence"
          receipt="_/build/fdroid/acceptance/$SOURCE_SHA.json"
          git cat-file -e "HEAD:$receipt"
          version=$(jq -r '.binding.version_name' "$evidence/context.json")
          bash aici-policy/release-promotion/gate.sh tag-accepted \
            "$GITHUB_REPOSITORY" "v$version" "$SOURCE_SHA" \
            "$evidence/context.json" "$receipt" \
            "$evidence/candidate/zero-infinity-$version-device-candidate.apk" \
            "$evidence/unsigned/wegert-$version-fdroid-unsigned.apk"
