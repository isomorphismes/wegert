name: Android native build and device emulation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run factor-drag host tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iapp/src/main/cpp tests/factor_drag_test.c -lm \
            -o "$RUNNER_TEMP/wegert-factor-drag-test"
          "$RUNNER_TEMP/wegert-factor-drag-test"

      - name: Test non-arm64 Cartesian complex fallback
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            app/src/main/cpp/complex_math_fallback.c \
            tests/complex_math_test.c \
            -lm -o /tmp/wegert-complex-math-test
          /tmp/wegert-complex-math-test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify isolated ICK arm64 object
        shell: bash
        run: |
          set -euxo pipefail
          object_dir="app/src/main/cpp/prebuilt/arm64-v8a"
          (
            cd "$object_dir"
            sha256sum -c complex_math_ick.o.sha256
          )

          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          llvm_bin="$sdk_root/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$llvm_bin/llvm-readelf" -h "$object_dir/complex_math_ick.o" \
            | tee /tmp/ick-complex-math.elf
          grep -q 'Machine:.*AArch64' /tmp/ick-complex-math.elf

          "$llvm_bin/llvm-nm" -u "$object_dir/complex_math_ick.o" \
            | tee /tmp/ick-complex-math.undefined
          ! grep -Eq '__mul(sc|dc|xc)3|__div(sc|dc|xc)3' \
            /tmp/ick-complex-math.undefined

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Test host-side state rules
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_continuation_path.c -lm -o /tmp/wegert-continuation-test
          /tmp/wegert-continuation-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_gesture_state.c -lm -o /tmp/wegert-gesture-test
          /tmp/wegert-gesture-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_state.c -o /tmp/wegert-factor-test
          /tmp/wegert-factor-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_snap.c -lm -o /tmp/wegert-factor-snap-test
          /tmp/wegert-factor-snap-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            tests/test_polynomial_text.c app/src/main/cpp/complex_math_fallback.c \
            -lm -o /tmp/wegert-polynomial-text-test
          /tmp/wegert-polynomial-text-test

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contains every supported ABI
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-files
          grep -q 'lib/arm64-v8a/libwegert.so' /tmp/apk-files
          grep -q 'lib/armeabi-v7a/libwegert.so' /tmp/apk-files
          grep -q 'lib/x86_64/libwegert.so' /tmp/apk-files

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: miro-a1
            api: 34
            profile: medium_phone
            memory: 2048M
            size: 720x1280
            density: 320
          - device: tab-p10
            api: 35
            profile: pixel_tablet
            memory: 4096M
            size: 1280x800
            density: 160

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: wegert-debug-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulate ${{ matrix.device }} and smoke-test Wegert
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.memory }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.wegert/android.app.NativeActivity
            sleep 4
            adb logcat -d > wegert-${{ matrix.device }}.log
            adb exec-out screencap -p > wegert-${{ matrix.device }}.png
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            awk '/EGL surface ready:/ { split($NF, dimensions, "x"); width=dimensions[1]; height=dimensions[2] } END { exit !(width > 0 && height > 0) }' wegert-${{ matrix.device }}.log
            adb shell input swipe "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[1] / 2 + dimensions[2] / 7) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[2] / 2) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[1] / 2 + dimensions[2] / 7 + 80) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[2] / 2) }' wegert-${{ matrix.device }}.log)" 350
            sleep 1
            adb shell input tap "$(awk '/placement control centers:/ { value=$NF } END { sub(/^pole=/, "", value); split(value, coordinates, ","); print coordinates[1] }' wegert-${{ matrix.device }}.log)" "$(awk '/placement control centers:/ { value=$NF } END { sub(/^pole=/, "", value); split(value, coordinates, ","); print coordinates[2] }' wegert-${{ matrix.device }}.log)"
            adb shell input tap "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(3 * dimensions[1] / 4) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(2 * dimensions[2] / 5) }' wegert-${{ matrix.device }}.log)"
            sleep 1
            adb shell input tap "$(awk '/view control center:/ { value=$(NF-1) } END { print value }' wegert-${{ matrix.device }}.log)" "$(awk '/view control center:/ { value=$NF } END { print value }' wegert-${{ matrix.device }}.log)"
            sleep 1
            adb shell input tap "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(5 * dimensions[1] / 8) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(9 * dimensions[2] / 20) }' wegert-${{ matrix.device }}.log)"
            sleep 1
            adb shell input tap "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[1] / 4) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[2] / 2) }' wegert-${{ matrix.device }}.log)"
            sleep 1
            adb shell input swipe "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(2 * dimensions[1] / 5) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[2] / 2) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(3 * dimensions[1] / 5) }' wegert-${{ matrix.device }}.log)" "$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print int(dimensions[2] / 2) }' wegert-${{ matrix.device }}.log)" 350
            sleep 1
            adb logcat -d > wegert-${{ matrix.device }}.log
            adb exec-out screencap -p > wegert-${{ matrix.device }}.png
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -Fq 'continuation view enabled' wegert-${{ matrix.device }}.log
            grep -Fq 'continuation step added' wegert-${{ matrix.device }}.log
            grep -Fq 'continuation step rejected: tap must be inside the preceding Taylor disc' wegert-${{ matrix.device }}.log
            grep -Fq 'factor drag completed: kind=zero index=0' wegert-${{ matrix.device }}.log
            grep -Fq 'function overlay: (' wegert-${{ matrix.device }}.log
            grep -Fq ' ÷' wegert-${{ matrix.device }}.log
            awk '/continuation seeded at/ { sub(/^.*radius=/, ""); value=$1 } END { exit !(value != "" && value + 0 > 0 && value + 0 < 1000) }' wegert-${{ matrix.device }}.log
            awk '/continuation step added:/ { sub(/^.*radius=/, ""); value=$1 } END { exit !(value != "" && value + 0 > 0 && value + 0 < 1000) }' wegert-${{ matrix.device }}.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed' wegert-${{ matrix.device }}.log
            adb shell input tap "$(awk '/view control center:/ { value=$(NF-1) } END { print value }' wegert-${{ matrix.device }}.log)" "$(awk '/view control center:/ { value=$NF } END { print value }' wegert-${{ matrix.device }}.log)"
            sleep 1
            adb logcat -d > wegert-${{ matrix.device }}.log
            adb shell input tap "$(awk '/clear control center:/ { value=$(NF-1) } END { print value }' wegert-${{ matrix.device }}.log)" "$(awk '/clear control center:/ { value=$NF } END { print value }' wegert-${{ matrix.device }}.log)"
            sleep 1
            adb logcat -d > wegert-${{ matrix.device }}.log
            grep -Fq 'whole portrait factors cleared' wegert-${{ matrix.device }}.log
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            ! adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -Fq 'org.isomorphisms.wegert'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wegert-${{ matrix.device }}-emulator-evidence
          path: |
            wegert-${{ matrix.device }}.log
            wegert-${{ matrix.device }}.png
          if-no-files-found: warn
