name: Android native build and device emulation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Test host-side state rules
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_continuation_path.c -lm -o /tmp/wegert-continuation-test
          /tmp/wegert-continuation-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_gesture_state.c -o /tmp/wegert-gesture-test
          /tmp/wegert-gesture-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_state.c -o /tmp/wegert-factor-test
          /tmp/wegert-factor-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_snap.c -lm -o /tmp/wegert-factor-snap-test
          /tmp/wegert-factor-snap-test

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: miro-a1
            api: 34
            profile: medium_phone
            memory: 2048M
            size: 720x1280
            density: 320
          - device: tab-p10
            api: 35
            profile: pixel_tablet
            memory: 4096M
            size: 1280x800
            density: 160

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: wegert-debug-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulate ${{ matrix.device }} and smoke-test Wegert
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.memory }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.wegert/android.app.NativeActivity
            sleep 4
            adb logcat -d > wegert-${{ matrix.device }}.log
            adb exec-out screencap -p > wegert-${{ matrix.device }}.png
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            wegert_surface="$(adb logcat -d | tr -d '\r' | awk '/EGL surface ready:/ { value=$NF } END { print value }')"
            wegert_surface_width="${wegert_surface%x*}"
            wegert_surface_height="${wegert_surface#*x}"
            test "$wegert_surface_width" -gt 0
            test "$wegert_surface_height" -gt 0
            wegert_portrait_y="$((wegert_surface_height / 2))"
            wegert_drag_start_x="$((2 * wegert_surface_width / 5))"
            wegert_drag_end_x="$((3 * wegert_surface_width / 5))"
            wegert_pole_control="$(adb logcat -d | tr -d '\r' | awk '/placement control centers:/ { value=$NF } END { print value }')"
            wegert_pole_control="${wegert_pole_control#pole=}"
            wegert_pole_control_x="${wegert_pole_control%,*}"
            wegert_pole_control_y="${wegert_pole_control#*,}"
            test "$wegert_pole_control_x" -gt 0
            test "$wegert_pole_control_y" -gt 0
            adb shell input tap "$wegert_pole_control_x" "$wegert_pole_control_y"
            wegert_pole_x="$((3 * wegert_surface_width / 4))"
            wegert_pole_y="$((2 * wegert_surface_height / 5))"
            adb shell input tap "$wegert_pole_x" "$wegert_pole_y"
            sleep 1
            wegert_view_x="$(adb logcat -d | tr -d '\r' | awk '/view control center:/ { value=$(NF-1) } END { print value }')"
            wegert_view_y="$(adb logcat -d | tr -d '\r' | awk '/view control center:/ { value=$NF } END { print value }')"
            test -n "$wegert_view_x"
            test -n "$wegert_view_y"
            adb shell input tap "$wegert_view_x" "$wegert_view_y"
            sleep 1
            wegert_inside_x="$(((wegert_surface_width / 2 + wegert_pole_x) / 2))"
            wegert_inside_y="$(((wegert_surface_height / 2 + wegert_pole_y) / 2))"
            adb shell input tap "$wegert_inside_x" "$wegert_inside_y"
            sleep 1
            wegert_outside_x="$((wegert_surface_width / 4))"
            adb shell input tap "$wegert_outside_x" "$wegert_portrait_y"
            sleep 1
            adb shell input swipe "$wegert_drag_start_x" "$wegert_portrait_y" "$wegert_drag_end_x" "$wegert_portrait_y" 350
            sleep 1
            adb logcat -d > wegert-${{ matrix.device }}.log
            adb exec-out screencap -p > wegert-${{ matrix.device }}.png
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -Fq 'continuation view enabled' wegert-${{ matrix.device }}.log
            grep -Fq 'continuation step added' wegert-${{ matrix.device }}.log
            grep -Fq 'continuation step rejected: tap must be inside the preceding Taylor disc' wegert-${{ matrix.device }}.log
            wegert_seed_radius="$(awk '/continuation seeded at/ { sub(/^.*radius=/, ""); value=$1 } END { print value }' wegert-${{ matrix.device }}.log)"
            printf '%s\n' "$wegert_seed_radius" | grep -Eq '^[+]?[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$'
            awk -v radius="$wegert_seed_radius" 'BEGIN { exit !(radius > 0 && radius < 1000) }'
            wegert_step_radius="$(awk '/continuation step added:/ { sub(/^.*radius=/, ""); value=$1 } END { print value }' wegert-${{ matrix.device }}.log)"
            printf '%s\n' "$wegert_step_radius" | grep -Eq '^[+]?[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$'
            awk -v radius="$wegert_step_radius" 'BEGIN { exit !(radius > 0 && radius < 1000) }'
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed' wegert-${{ matrix.device }}.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wegert-${{ matrix.device }}-emulator-evidence
          path: |
            wegert-${{ matrix.device }}.log
            wegert-${{ matrix.device }}.png
          if-no-files-found: warn
