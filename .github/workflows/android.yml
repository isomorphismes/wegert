name: Android native build and device emulation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: miro-a1
            api: 34
            profile: medium_phone
            memory: 2048M
            size: 720x1280
            density: 320
          - device: tab-p10
            api: 35
            profile: pixel_tablet
            memory: 4096M
            size: 1280x800
            density: 160

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: wegert-debug-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulate ${{ matrix.device }} and smoke-test Wegert
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.memory }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -eu
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb install -r artifacts/app-debug.apk
            adb logcat -c

            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.wegert/android.app.NativeActivity
            sleep 4

            pid="$(adb shell pidof -s org.isomorphisms.wegert | tr -d '\r')"
            test -n "$pid"

            # Exercise the single-touch paths: add a zero, then pan.
            adb shell input tap 180 180
            adb shell input swipe 280 300 480 300 350
            sleep 2

            pid_after="$(adb shell pidof -s org.isomorphisms.wegert | tr -d '\r')"
            test -n "$pid_after"

            adb logcat -d --pid="$pid_after" > wegert-${{ matrix.device }}.log
            adb exec-out screencap -p > wegert-${{ matrix.device }}.png

            if grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|Fatal signal|FATAL EXCEPTION' wegert-${{ matrix.device }}.log; then
              cat wegert-${{ matrix.device }}.log
              exit 1
            fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wegert-${{ matrix.device }}-emulator-evidence
          path: |
            wegert-${{ matrix.device }}.log
            wegert-${{ matrix.device }}.png
          if-no-files-found: warn
