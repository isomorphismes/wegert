name: Publish tested APK

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main-branch direct DEX/JNI run containing the ART-qualified APK
        required: true
        type: string
      source_sha:
        description: Exact main-branch commit qualified by that run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Validate the requested direct DEX/JNI run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg sha "$SOURCE_SHA" \
            '.conclusion == "success" and
             .head_sha == $sha and
             .head_branch == "main" and
             .event == "push" and
             .name == "Direct DEX and JNI Android build" and
             .path == ".github/workflows/direct-dex-jni.yml"' \
            <<<"$run_json" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read source-controlled release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source _/build/fdroid/release-values.sh
          echo "version=$WEGERT_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$WEGERT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$WEGERT_VERSION_NAME" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@v3

      - name: Install APK inspection tool
        run: sdkmanager "build-tools;36.0.0"

      - name: Download and verify the exact ART-qualified APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CODE: ${{ steps.release.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/direct
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name wegert-direct-dex-jni \
            --dir release/direct

          source_apk=release/direct/wegert-direct-debug.apk
          test -s "$source_apk"
          grep -Fxq "wegert=$SOURCE_SHA" release/direct/revisions.txt
          expected_hash="$(awk '$2 ~ /wegert-direct-debug[.]apk$/ {print $1}' release/direct/sha256sums.txt)"
          test -n "$expected_hash"
          test "$(sha256sum "$source_apk" | awk '{print $1}')" = "$expected_hash"

          unzip -t "$source_apk"
          for required in \
            AndroidManifest.xml \
            classes.dex \
            lib/arm64-v8a/libwegert.so \
            lib/armeabi-v7a/libwegert.so \
            lib/x86_64/libwegert.so; do
            unzip -Z1 "$source_apk" | grep -Fxq "$required"
          done

          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/build-tools/36.0.0/aapt" dump badging "$source_apk" \
            > "$RUNNER_TEMP/wegert-direct-badging.txt"
          grep -Fq \
            "package: name='org.isomorphisms.wegert' versionCode='$RELEASE_CODE' versionName='$RELEASE_VERSION'" \
            "$RUNNER_TEMP/wegert-direct-badging.txt"
          grep -Fq \
            "launchable-activity: name='org.isomorphisms.wegert.WegertActivity'" \
            "$RUNNER_TEMP/wegert-direct-badging.txt"

          release_apk="release/wegert-$RELEASE_VERSION.apk"
          cp "$source_apk" "$release_apk"
          (
            cd release
            sha256sum "wegert-$RELEASE_VERSION.apk" \
              > "wegert-$RELEASE_VERSION.apk.sha256"
          )

      - name: Require the release tag to identify the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha'
          )"
          test "$tag_sha" = "$SOURCE_SHA"

      - name: Publish durable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_title="Wegert Android test $RELEASE_VERSION"
          release_notes="Installable direct DEX/JNI test APK from run $SOURCE_RUN_ID at commit $SOURCE_SHA.

          That exact artifact passed the direct source-pinned DEX build, native symbol checks, installation on ART, and the JNI sentinel check before publication. It is signed with the repository's public test-only debug key. F-Droid remains a separate source-build and signing boundary."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$release_title" \
              --notes "$release_notes" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            "release/wegert-$RELEASE_VERSION.apk" \
            "release/wegert-$RELEASE_VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
