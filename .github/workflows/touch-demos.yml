name: Record touch demonstrations

on:
  pull_request:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the tested drag APK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/isomorphisms/wegert/releases/download/v0.1.50/wegert-0.1.50.apk \
            --output wegert.apk

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record demonstrations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: sh .github/scripts/record-touch-demos.sh

      - name: Encode repository-sized MP4s
        run: |
          mkdir -p encoded-demos
          for input in raw-demos/*.mp4; do
            output="encoded-demos/$(basename "$input")"
            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -an -vf fps=30 -c:v libx264 -preset medium -crf 24 \
              -pix_fmt yuv420p -movflags +faststart "$output"
          done
          ffprobe -v error -show_entries format=filename,duration,size \
            -of default=noprint_wrappers=1 encoded-demos/*.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-touch-demos
          path: encoded-demos/*.mp4
          if-no-files-found: error
          retention-days: 7
