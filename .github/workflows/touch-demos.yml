name: Record touch demonstrations

on:
  pull_request:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the tested drag APK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/isomorphisms/wegert/releases/download/v0.1.50/wegert-0.1.50.apk \
            --output wegert.apk

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record demonstrations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -eu
            mkdir -p raw-demos
            adb shell wm size 720x1280
            adb shell wm density 320
            adb install -r wegert.apk
            adb shell settings put system show_touches 1
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.wegert/android.app.NativeActivity
            sleep 4

            # Start from an empty function. At 720x1280/320 dpi the clear button
            # is centered near (518, 1120), ○ near (65, 1215), and × near (168, 1215).
            adb shell input tap 518 1120
            sleep 1

            adb shell screenrecord --size 720x1280 --bit-rate 2500000 --time-limit 13 \
              /sdcard/add-and-drag-zero-and-pole.mp4 &
            first_recorder_pid=$!
            sleep 1
            adb shell input tap 65 1215
            sleep 0.6
            adb shell input tap 220 460
            sleep 1.2
            adb shell input tap 168 1215
            sleep 0.6
            adb shell input tap 500 760
            sleep 1.2
            adb shell input swipe 220 460 350 360 1100
            sleep 1.2
            adb shell input swipe 500 760 420 900 1100
            sleep 2.2
            wait "$first_recorder_pid"
            adb pull /sdcard/add-and-drag-zero-and-pole.mp4 raw-demos/

            adb shell input tap 518 1120
            sleep 1

            adb shell screenrecord --size 720x1280 --bit-rate 2500000 --time-limit 17 \
              /sdcard/add-and-drag-two-zeros-and-two-poles.mp4 &
            second_recorder_pid=$!
            sleep 1
            adb shell input tap 65 1215
            sleep 0.5
            adb shell input tap 190 420
            sleep 0.8
            adb shell input tap 260 850
            sleep 1
            adb shell input tap 168 1215
            sleep 0.5
            adb shell input tap 520 430
            sleep 0.8
            adb shell input tap 470 820
            sleep 1
            adb shell input swipe 190 420 300 520 1000
            sleep 0.7
            adb shell input swipe 260 850 360 750 1000
            sleep 0.7
            adb shell input swipe 520 430 430 320 1000
            sleep 0.7
            adb shell input swipe 470 820 540 940 1000
            sleep 2
            wait "$second_recorder_pid"
            adb pull /sdcard/add-and-drag-two-zeros-and-two-poles.mp4 raw-demos/

      - name: Encode repository-sized MP4s
        run: |
          mkdir -p encoded-demos
          for input in raw-demos/*.mp4; do
            output="encoded-demos/$(basename "$input")"
            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -an -vf fps=30 -c:v libx264 -preset medium -crf 24 \
              -pix_fmt yuv420p -movflags +faststart "$output"
          done
          ffprobe -v error -show_entries format=filename,duration,size \
            -of default=noprint_wrappers=1 encoded-demos/*.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-touch-demos
          path: encoded-demos/*.mp4
          if-no-files-found: error
          retention-days: 7
