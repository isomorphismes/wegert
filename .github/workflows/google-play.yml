name: Google Play app bundle

on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/google-play.yml'
      - 'docs/google-play-release.md'
  workflow_dispatch:
    inputs:
      version_code:
        description: New, permanently increasing Play version code
        required: true
        type: string
      version_name:
        description: User-visible version, such as 0.1.0
        required: true
        type: string
      destination:
        description: Keep the bundle as an artifact for the first manual upload, or send it to internal testing
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - internal-track
      release_status:
        description: State of an internal-track release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-wegert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '9.5.0'

      - name: Create disposable validation key
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.p12 \
            -storetype PKCS12 \
            -storepass validation-only \
            -keypass validation-only \
            -alias validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Validation'

      - name: Build signed validation bundle
        env:
          PLAY_VERSION_CODE: '1'
          PLAY_VERSION_NAME: ci
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/ci-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: validation-only
          ANDROID_UPLOAD_KEY_ALIAS: validation
          ANDROID_UPLOAD_KEY_PASSWORD: validation-only
        run: gradle --no-daemon :app:bundleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wegert-validation-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '9.5.0'

      - name: Restore private upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > /tmp/play-upload.p12

      - name: Build signed app bundle
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/play-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Save signed app bundle and native symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wegert-${{ inputs.version_name }}-play-files
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error

      - name: Require Google Play credential
        if: inputs.destination == 'internal-track'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$SERVICE_ACCOUNT_JSON"

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal-track'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.isomorphisms.wegert
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          debugSymbols: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          tracks: internal
          status: ${{ inputs.release_status }}
          releaseName: ${{ inputs.version_name }}
