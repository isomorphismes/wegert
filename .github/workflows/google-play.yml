name: Google Play app bundle

on:
  pull_request:
    paths:
      - '.github/workflows/google-play.yml'
      - '_/build/app/**'
      - '_/build/CMakeLists.txt'
      - '_/build/build.gradle.kts'
      - '_/build/settings.gradle.kts'
      - '_/build/fdroid/release.properties'
      - '_/build/fdroid/release-values.sh'
      - '_/build/fdroid/verify-metadata.sh'
      - '_/build/docs/google-play-release.md'
      - 'code/**'
  workflow_dispatch:
    inputs:
      destination:
        description: Keep the signed bundle as an artifact or upload it to Play internal testing
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - internal-track
      release_status:
        description: State of an internal-track release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-wegert-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_ROOT: _/build

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Verify shared release identity and store metadata
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"
          fdroid/verify-metadata.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install pinned Android build inputs
        shell: bash
        run: |
          set -euxo pipefail
          source "$BUILD_ROOT/fdroid/release-values.sh"
          sdkmanager             "platforms;android-$WEGERT_TARGET_SDK"             "build-tools;$WEGERT_BUILD_TOOLS"             "ndk;$WEGERT_NDK_VERSION"             "cmake;$WEGERT_CMAKE_VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Create disposable validation upload key
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/play-validation.p12"             -storetype PKCS12             -storepass validation-only             -keypass validation-only             -alias validation             -keyalg RSA             -keysize 2048             -validity 2             -dname 'CN=CI Validation'

      - name: Build signed validation bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/play-validation.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: validation-only
          ANDROID_UPLOAD_KEY_ALIAS: validation
          ANDROID_UPLOAD_KEY_PASSWORD: validation-only
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"
          gradle --no-daemon :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/play-aab-files"
          for required in \
            base/lib/arm64-v8a/libwegert.so \
            base/lib/armeabi-v7a/libwegert.so \
            base/lib/x86_64/libwegert.so \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/arm64-v8a/libwegert.so.dbg \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/armeabi-v7a/libwegert.so.dbg \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/x86_64/libwegert.so.dbg; do
            grep -Fxq "$required" "$RUNNER_TEMP/play-aab-files"
          done

      - name: Retain validation Play artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wegert-play-validation
          path: |
            _/build/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: google-play

    steps:
      - uses: actions/checkout@v4

      - name: Verify shared release identity and store metadata
        id: release
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_ROOT"
          fdroid/verify-metadata.sh
          source fdroid/release-values.sh
          echo "version=$WEGERT_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$WEGERT_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install pinned Android build inputs
        shell: bash
        run: |
          set -euxo pipefail
          source "$BUILD_ROOT/fdroid/release-values.sh"
          sdkmanager             "platforms;android-$WEGERT_TARGET_SDK"             "build-tools;$WEGERT_BUILD_TOOLS"             "ndk;$WEGERT_NDK_VERSION"             "cmake;$WEGERT_CMAKE_VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore private Play upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.p12"
          chmod 600 "$RUNNER_TEMP/play-upload.p12"

      - name: Build signed Play bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/play-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          cd "$BUILD_ROOT"
          gradle --no-daemon :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/play-aab-files"
          for required in \
            base/lib/arm64-v8a/libwegert.so \
            base/lib/armeabi-v7a/libwegert.so \
            base/lib/x86_64/libwegert.so \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/arm64-v8a/libwegert.so.dbg \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/armeabi-v7a/libwegert.so.dbg \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/x86_64/libwegert.so.dbg; do
            grep -Fxq "$required" "$RUNNER_TEMP/play-aab-files"
          done

      - name: Prepare shared release note for Play
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/play-whatsnew"
          cp             "$BUILD_ROOT/app/src/main/play/release-notes/en-US/default.txt"             "$RUNNER_TEMP/play-whatsnew/whatsnew-en-US"

      - name: Retain signed Play artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wegert-${{ steps.release.outputs.version }}-play
          path: |
            _/build/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Require Google Play service-account credential
        if: inputs.destination == 'internal-track'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: test -n "$SERVICE_ACCOUNT_JSON"

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal-track'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.isomorphisms.wegert
          releaseFiles: _/build/app/build/outputs/bundle/release/app-release.aab
          whatsNewDirectory: ${{ runner.temp }}/play-whatsnew
          tracks: internal
          status: ${{ inputs.release_status }}
          releaseName: ${{ steps.release.outputs.version }}
