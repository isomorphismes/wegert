name: Jones trefoil icon runtime capture

on:
  push:
    branches: [jones-trefoil-icon]
    paths:
      - 'code/wegert.c'
      - 'code/wegert.frag.in'
      - 'code/wegert_color.glsl'
      - '_/build/CMakeLists.txt'
      - '_/build/app/build.gradle.kts'
      - '.github/workflows/jones-trefoil-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build icon-capture APK
        run: gradle --no-daemon -PiconCapture=true :app:assembleDebug

      - name: Install image cropper
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Enable KVM permissions
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture actual Wegert renderer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size 512x512
            adb shell wm density 160
            adb shell settings put global policy_control immersive.full=*
            adb install -r _/build/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.wegert/android.app.NativeActivity
            sleep 4
            adb logcat -d > jones-trefoil-icon.log
            adb exec-out screencap -p > jones-trefoil-icon-512.png
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed' jones-trefoil-icon.log
            python3 -c 'import struct; f=open("jones-trefoil-icon-512.png","rb"); assert f.read(8).hex()=="89504e470d0a1a0a"; f.read(4); assert f.read(4)==b"IHDR"; w,h=struct.unpack(">II",f.read(8)); print(w,h); assert (w,h)==(512,512),(w,h)'
            convert jones-trefoil-icon-512.png -crop 460x460+26+0 +repage -resize 512x512 jones-trefoil-icon.png

      - name: Record Jones icon family
        working-directory: .
        run: |
          git pull --rebase origin jones-trefoil-icon
          mkdir -p rendered_images/icon-candidates
          if [ ! -e rendered_images/icon-candidates/original-phase-portrait.png ]; then
            cp rendered_images/wegert-icon-512.png rendered_images/icon-candidates/original-phase-portrait.png
          fi
          cp jones-trefoil-icon.png rendered_images/icon-candidates/jones-trefoil.png
          cp jones-trefoil-icon.png rendered_images/wegert-icon-512.png
          cp jones-trefoil-icon.png _/build/artwork/wegert-icon-512.png
          cp jones-trefoil-icon.png _/build/app/src/main/play/listings/en-US/graphics/icon/icon.png

          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert jones-trefoil-icon.png -resize "${size}x${size}!" "_/build/app/src/main/res/mipmap-${density}/ic_launcher.png"
            convert jones-trefoil-icon.png -resize "${size}x${size}!" \
              \( -size "${size}x${size}" xc:none -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) \
              -alpha off -compose CopyOpacity -composite "_/build/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          for spec in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert jones-trefoil-icon.png -resize "${size}x${size}!" "_/build/app/src/main/res/drawable-${density}/ic_launcher_foreground.png"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rendered_images/icon-candidates \
            rendered_images/wegert-icon-512.png \
            _/build/artwork/wegert-icon-512.png \
            _/build/app/src/main/play/listings/en-US/graphics/icon/icon.png \
            _/build/app/src/main/res/drawable-*/ic_launcher_foreground.png \
            _/build/app/src/main/res/mipmap-*/ic_launcher.png \
            _/build/app/src/main/res/mipmap-*/ic_launcher_round.png
          if ! git diff --cached --quiet; then
            git commit -m "Use Jones-trefoil portrait for launcher icon"
            git push origin HEAD:jones-trefoil-icon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jones-trefoil-icon-runtime-capture
          path: |
            jones-trefoil-icon-512.png
            jones-trefoil-icon.png
            jones-trefoil-icon.log
          if-no-files-found: error
