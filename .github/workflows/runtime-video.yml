name: Capture tagged Wegert runtime video

on:
  push:
    branches:
      - video/capture-v0.1.50-runtime

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tagged APK and record the actual app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -eu
            curl -L --fail --retry 3 \
              -o "$RUNNER_TEMP/wegert-0.1.50.apk" \
              https://github.com/isomorphismes/wegert/releases/download/v0.1.50/wegert-0.1.50.apk
            echo '897490843da536259c3701c1f6e7f1c43e1c7411a91ce5a2c82b6ff2490ef28b  '"$RUNNER_TEMP/wegert-0.1.50.apk" | sha256sum -c -
            adb shell wm size 720x1280
            adb shell wm density 320
            adb install -r "$RUNNER_TEMP/wegert-0.1.50.apk"
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.wegert/android.app.NativeActivity
            sleep 4
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            adb shell screenrecord --bit-rate 8000000 --time-limit 15 /sdcard/wegert-runtime.mp4
            adb pull /sdcard/wegert-runtime.mp4 wegert-v0.1.50-runtime.mp4
            adb logcat -d > wegert-v0.1.50-runtime.log
            test -s wegert-v0.1.50-runtime.mp4
            if grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed' wegert-v0.1.50-runtime.log; then
              exit 1
            fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wegert-v0.1.50-runtime-video
          path: |
            wegert-v0.1.50-runtime.mp4
            wegert-v0.1.50-runtime.log
          if-no-files-found: error
