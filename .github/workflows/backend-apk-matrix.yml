name: Backend APK matrix - C fallback

on:
  push:
    branches: [build/backend-apk-matrix]
  workflow_dispatch:

concurrency:
  group: wegert-backend-apk-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-c-fallback:
    name: Build all-C fallback APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: _/build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Check the host Cartesian fallback
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            complex_math_fallback.c tests/complex_math_test.c \
            -lm -o /tmp/wegert-complex-math-fallback-test
          /tmp/wegert-complex-math-fallback-test

      - name: Build APK with the prebuilt ICK object disabled
        run: gradle --no-daemon -PfdroidBuild=true :app:assembleDebug

      - name: Verify fallback configuration and APK payload
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" > /tmp/wegert-c-fallback-apk-files.txt
          grep -Fxq lib/arm64-v8a/libwegert.so /tmp/wegert-c-fallback-apk-files.txt
          grep -Fxq lib/armeabi-v7a/libwegert.so /tmp/wegert-c-fallback-apk-files.txt
          grep -Fxq lib/x86_64/libwegert.so /tmp/wegert-c-fallback-apk-files.txt
          grep -Eq '^assets/.+' /tmp/wegert-c-fallback-apk-files.txt

          mapfile -t arm64_caches < <(find app/.cxx -type f -path '*/arm64-v8a/CMakeCache.txt' -print)
          test "${#arm64_caches[@]}" -gt 0
          for cache in "${arm64_caches[@]}"; do
            grep -Fq 'WEGERT_USE_ICK_PREBUILT:BOOL=OFF' "$cache"
          done

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/wegert-c-fallback.apk"
          sha256sum "$GITHUB_WORKSPACE/wegert-c-fallback.apk" \
            > "$GITHUB_WORKSPACE/wegert-c-fallback.apk.sha256"
          {
            echo 'WEGERT_C_FALLBACK_APK 1'
            echo 'arm64-v8a PASS C fallback selected'
            echo 'armeabi-v7a PASS C fallback'
            echo 'x86_64 PASS C fallback'
            echo 'ICK prebuilt SKIP deliberately disabled'
            sha256sum "$GITHUB_WORKSPACE/wegert-c-fallback.apk"
          } > "$GITHUB_WORKSPACE/wegert-c-fallback-receipt.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-c-fallback-apk
          path: |
            wegert-c-fallback.apk
            wegert-c-fallback.apk.sha256
            wegert-c-fallback-receipt.txt
          if-no-files-found: error

  emulate-c-fallback:
    name: Emulate all-C fallback APK
    needs: build-c-fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wegert-c-fallback-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the real GLES renderer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            set -eu
            adb install -r artifacts/wegert-c-fallback.apk
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.wegert/android.app.NativeActivity
            timeout 20 bash -c 'until adb logcat -d | grep -Fq "EGL surface ready:"; do sleep 1; done'
            sleep 2
            adb logcat -d > wegert-c-fallback-emulator.log
            adb exec-out screencap -p > wegert-c-fallback-emulator.png
            adb shell pidof -s org.isomorphisms.wegert | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -Fq 'EGL surface ready:' wegert-c-fallback-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|FATAL EXCEPTION' wegert-c-fallback-emulator.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wegert-c-fallback-emulator-evidence
          path: |
            wegert-c-fallback-emulator.log
            wegert-c-fallback-emulator.png
          if-no-files-found: warn
