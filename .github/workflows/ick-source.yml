name: ICK source-built Wegert boundary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ICK_REPOSITORY: dilapidated-shed/ick
  ICK_COMMIT: fbe86e23d55cfec2000c08e61deea2a407fd7175
  ANDROID_NDK_VERSION: 29.0.14206865
  # NDK r29 assembles target output and does not accept GNU as .base64.
  gcc_cv_as_base64: 'no'

jobs:
  ick-compilers:
    uses: ./.github/workflows/ick-compilers.yml
  source-built-ick-apk:
    needs: ick-compilers
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out Wegert
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out the pinned owned C producer interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: f6d825d15cd3c0c34ae1b43240a463ff5d343090
          path: _/ai-ci-ick
          persist-credentials: false
      - name: Download all qualified ICK ABI stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wegert-ick-*
          merge-multiple: true
          path: _/build/ick-packages
      - name: Restore checked producers at canonical build paths
        working-directory: ${{ github.workspace }}
        run: make -f _/build/icky/Restore.mk restore

      - name: Remove checked ICK object before qualification
        shell: bash
        run: |
          set -euxo pipefail
          rm -f _/build/complex_math_ick.o
          test ! -e _/build/complex_math_ick.o

      - name: Check out pinned ICK source of truth
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ICK_REPOSITORY }}
          ref: ${{ env.ICK_COMMIT }}
          fetch-depth: 1
          submodules: true
          path: ick-source

      - name: Verify and materialize ICK-owned source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C ick-source rev-parse HEAD)" = "$ICK_COMMIT"
          . ick-source/ick/SOURCE.lock
          test "$(git -C ick-source/gcc rev-parse HEAD)" = "$gcc_commit"
          sh ick-source/ick/materialize.sh             ick-source/gcc             "$GITHUB_WORKSPACE/ick-build/source"
          test -s ick-build/source/COPYING3
          test -s ick-build/source/COPYING.RUNTIME

      - name: Install ICK build and AArch64 execution tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             build-essential file flex bison texinfo             libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev             binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu             libc6-dev-arm64-cross qemu-user

      - name: Configure source-built AArch64 ICK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ick-build/build ick-build/stage
          cd ick-build/build
          ../source/configure             --target=aarch64-linux-gnu             --prefix="$GITHUB_WORKSPACE/ick-build/stage"             --with-as="$(command -v aarch64-linux-gnu-as)"             --with-ld="$(command -v aarch64-linux-gnu-ld)"             --enable-languages=c             --disable-bootstrap             --disable-multilib             --disable-nls             --disable-shared             --disable-threads             --without-headers             --disable-libatomic             --disable-libgomp             --disable-libquadmath             --disable-libssp             --disable-libvtv

      - name: Build ICK from its owned source
        shell: bash
        run: |
          set -euxo pipefail
          make -C ick-build/build -j2 gcc_cv_as_base64=no all-gcc
          grep -Fx '/* #undef HAVE_GAS_BASE64 */' ick-build/build/gcc/auto-host.h
          make -C ick-build/build gcc_cv_as_base64=no install-gcc
          ick="$GITHUB_WORKSPACE/ick-build/stage/bin/aarch64-linux-gnu-gcc"
          "$ick" --version
          cc1_path="$("$ick" -print-prog-name=cc1)"
          test -x "$cc1_path"
          case "$cc1_path" in
            "$GITHUB_WORKSPACE/ick-build/stage"/*) ;;
            *) echo "cc1 escaped the source-built ICK installation: $cc1_path" >&2; exit 1 ;;
          esac

      - name: Rebuild Wegert complex boundary with ICK
        shell: bash
        run: |
          set -euxo pipefail
          ick="$GITHUB_WORKSPACE/ick-build/stage/bin/aarch64-linux-gnu-gcc"

          "$ick"             -std=gnu11 -O2 -fPIC -ffixed-x18 -fvisibility=hidden             -S _/build/complex_math_ick.c             -o "$RUNNER_TEMP/complex_math_ick.s"
          if grep -Eq '(^|[^[:alnum:]_])(x18|w18)([^[:alnum:]_]|$)'               "$RUNNER_TEMP/complex_math_ick.s"; then
            echo 'Android-reserved x18 was used' >&2
            exit 1
          fi

          "$ick"             -std=gnu11 -O2 -fPIC -ffixed-x18 -fvisibility=hidden             -c _/build/complex_math_ick.c             -o "$RUNNER_TEMP/complex_math_ick.o"

          aarch64-linux-gnu-readelf -h "$RUNNER_TEMP/complex_math_ick.o"             | tee "$RUNNER_TEMP/complex_math_ick.elf"
          grep -q 'Machine:.*AArch64' "$RUNNER_TEMP/complex_math_ick.elf"

          aarch64-linux-gnu-nm -g --defined-only "$RUNNER_TEMP/complex_math_ick.o"             | tee "$RUNNER_TEMP/complex_math_ick.defined"
          grep -Eq '[[:space:]]wegert_expand_roots_cartesian$'             "$RUNNER_TEMP/complex_math_ick.defined"

          aarch64-linux-gnu-nm -u "$RUNNER_TEMP/complex_math_ick.o"             | tee "$RUNNER_TEMP/complex_math_ick.undefined"
          ! grep -Eq '__mul(sc|dc|xc)3|__div(sc|dc|xc)3'             "$RUNNER_TEMP/complex_math_ick.undefined"

          sha256sum "$RUNNER_TEMP/complex_math_ick.o"             | tee "$RUNNER_TEMP/source-built-object.sha256"

      - name: Execute the rebuilt Wegert boundary under AArch64
        shell: bash
        run: |
          set -euxo pipefail
          aarch64-linux-gnu-gcc -std=c11 -O2 -fPIE             _/build/tests/complex_math_test.c             "$RUNNER_TEMP/complex_math_ick.o"             -lm -o "$RUNNER_TEMP/wegert-ick-complex-math-test"
          qemu-aarch64 -L /usr/aarch64-linux-gnu             "$RUNNER_TEMP/wegert-ick-complex-math-test"

      - name: Install Android toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Fetch pinned Android packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;$ANDROID_NDK_VERSION"             "cmake;3.22.1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/checkout@v4
        with:
          repository: isomorphisms/catfood
          ref: 7cbf4b3873bf165c1ef079b1d89fa9340085f86d
          path: catfood-policy
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: isomorphisms/android-NDK
          ref: 58bf23c6f6a3b279bf2e5bd7866537771b49cf0c
          path: android-ndk-packager
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: isomorphisms/ai-ci
          ref: 01608a2493fa409463f70e8fbfd8a123ef59ee85
          path: aici-signing-policy
          persist-credentials: false

      - name: Build A1/C67 direct NativeActivity APKs from one plan, no Gradle
        shell: bash
        env:
          CATFOOD_CHECKOUT: ${{ github.workspace }}/catfood-policy
          ANDROID_NDK_REPO: ${{ github.workspace }}/android-ndk-packager
          AICI_CHECKOUT: ${{ github.workspace }}/aici-signing-policy
          WEGERT_ICK_OBJECT: ${{ runner.temp }}/complex_math_ick.o
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          bash _/build/nativeactivity/build-paired.sh "$RUNNER_TEMP/wegert-paired"

      - name: Independently verify finished A1 APK test signer
        uses: isomorphisms/ai-ci/android-signing@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          apk: ${{ runner.temp }}/wegert-paired/wegert-armeabi-v7a.apk
          lane: test

      - name: Independently verify finished C67 APK test signer
        uses: isomorphisms/ai-ci/android-signing@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          apk: ${{ runner.temp }}/wegert-paired/wegert-arm64-v8a.apk
          lane: test

      - name: Record source-built consumer receipt
        shell: bash
        run: |
          {
            echo '### ICK → Wegert paired APK candidate'
            echo
            echo "PASS: source-built ICK revision \`$ICK_REPOSITORY@$ICK_COMMIT\`"
            echo
            echo 'PASS: Wegert complex boundary rebuilt as AArch64 PIC with reserved x18 protected'
            echo
            echo 'PASS: Wegert AArch64 complex boundary executed under QEMU'
            echo
            echo 'PASS: Cat Food plan requires both A1 and C67'
            echo
            echo 'PASS: separate signed NativeActivity APKs assembled without Gradle'
            echo
            echo 'PASS: finished APKs preserve zero & infinity and the central stable test signer'
            echo
            echo 'CANDIDATE ONLY: Cat Food/NDK producer branches are not yet approved main'
            echo
            echo 'NOT VERIFIED: physical A1/C67 execution, replacement installation and F-Droid'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain paired signed APK candidates and exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: wegert-paired-ick-a1-c67-candidate
          path: |
            ${{ runner.temp }}/wegert-paired/wegert-*.apk
            ${{ runner.temp }}/wegert-paired/*.receipt.tsv
            ${{ runner.temp }}/wegert-paired/android-plan.tsv
            ${{ runner.temp }}/wegert-paired/apk-sha256.tsv
            ${{ runner.temp }}/wegert-paired/native-sizes.tsv
            ${{ runner.temp }}/wegert-paired/*.elf.txt
            ${{ runner.temp }}/complex_math_ick.o
            ${{ runner.temp }}/source-built-object.sha256
          if-no-files-found: error

