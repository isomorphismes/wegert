name: Populate canonical GPLv3 COPYING

on:
  push:
    branches:
      - licensing/include-gplv3-text

permissions:
  contents: write

jobs:
  populate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: licensing/include-gplv3-text
      - name: Add canonical GPLv3 text and remove this one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          test -f /usr/share/common-licenses/GPL-3
          cp /usr/share/common-licenses/GPL-3 COPYING
          echo '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  COPYING' | sha256sum -c -
          rm .github/workflows/populate-copying.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COPYING .github/workflows/populate-copying.yml
          git commit -m 'Include canonical GPLv3 license text'
          git push origin HEAD:licensing/include-gplv3-text
