name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - '_/build/**'
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - '_/build/**'
  workflow_dispatch:

concurrency:
  group: fdroid-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify release and Triple-T metadata
        run: fdroid/verify-metadata.sh

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build twice and require byte-identical unsigned APKs
        run: fdroid/reproducible-build.sh build/reproducible-fdroid

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wegert-fdroid-unsigned
          path: |
            _/build/build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk
            _/build/build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk.sha256
            _/build/build/reproducible-fdroid/diffoscope.txt
          if-no-files-found: error

  fdroiddata-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify release and Triple-T metadata
        run: fdroid/verify-metadata.sh

      - name: Produce candidate-v1 evidence from the production-like F-Droid run
        run: bash fdroid/produce-candidate-receipt.sh "$RUNNER_TEMP/wegert-fdroid-candidate"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wegert-fdroiddata-candidate
          path: |
            _/build/build/fdroiddata/
            ${{ runner.temp }}/wegert-fdroid-candidate/
          if-no-files-found: error
