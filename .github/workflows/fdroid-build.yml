name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'fdroid/**'
      - 'fastlane/**'
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/fdroid-build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'fdroid/**'
      - 'fastlane/**'
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release and Fastlane metadata
        run: fdroid/verify-metadata.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build twice and require byte-identical unsigned APKs
        run: fdroid/reproducible-build.sh build/reproducible-fdroid

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroid-unsigned
          path: |
            build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk
            build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk.sha256
            build/reproducible-fdroid/diffoscope.txt
          if-no-files-found: error

  fdroiddata-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release and Fastlane metadata
        run: fdroid/verify-metadata.sh

      - name: Run fdroiddata metadata, scanner, and production build tests
        run: fdroid/run-fdroiddata-tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroiddata-apk
          path: build/fdroiddata/
          if-no-files-found: error
