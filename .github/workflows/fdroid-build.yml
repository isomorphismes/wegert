name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '.github/workflows/ick-compilers.yml'
      - '_/build/icky/**'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - 'code/**'
      - 'LICENSE'
      - 'COPYING'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
      - 'ASSET_PROVENANCE.md'
      - '_/build/**'
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '.github/workflows/ick-compilers.yml'
      - '_/build/icky/**'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - 'code/**'
      - 'LICENSE'
      - 'COPYING'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
      - 'ASSET_PROVENANCE.md'
      - '_/build/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: fdroid-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ick-compilers:
    uses: ./.github/workflows/ick-compilers.yml
  release-apk:
    needs: ick-compilers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify F-Droid shell syntax before expensive builds
        run: |
          for script in fdroid/*.sh; do
            bash -n "$script"
          done
      - name: Exercise release guard positive and negative controls
        run: bash fdroid/test-release-guards.sh
      - name: Check out the pinned owned C producer interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 66023d128a316cf9ab2c5146df60bb9fed82bb17
          path: _/ai-ci-ick
          persist-credentials: false
      - name: Download all qualified ICK ABI stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wegert-ick-*
          merge-multiple: true
          path: _/build/ick-packages
      - name: Restore checked producers at canonical build paths
        working-directory: ${{ github.workspace }}
        run: make -f _/build/icky/Restore.mk restore

      - name: Verify release and Triple-T metadata
        run: fdroid/verify-metadata.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build twice and require byte-identical unsigned APKs
        run: fdroid/reproducible-build.sh build/reproducible-fdroid

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroid-unsigned
          path: |
            _/build/build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk
            _/build/build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk.sha256
            _/build/build/reproducible-fdroid/run-*.apk.ndk-source.properties
            _/build/build/reproducible-fdroid/diffoscope.txt
          if-no-files-found: error

      - name: Sign an unchanged F-Droid payload for physical testing only
        id: device_candidate
        run: |
          source fdroid/release-values.sh
          bash fdroid/prepare-device-candidate.sh \
            "build/reproducible-fdroid/wegert-$WEGERT_VERSION_NAME-fdroid-unsigned.apk" \
            build/fdroid-device-candidate
          echo "apk=_/build/build/fdroid-device-candidate/zero-infinity-$WEGERT_VERSION_NAME-device-candidate.apk" >> "$GITHUB_OUTPUT"

      - name: Independently verify the finished candidate's stable test signer
        uses: isomorphisms/ai-ci/android-signing@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          apk: ${{ steps.device_candidate.outputs.apk }}
          lane: test

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroid-device-candidate
          path: _/build/build/fdroid-device-candidate/
          if-no-files-found: error

  fdroiddata-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify F-Droid shell syntax before expensive builds
        run: |
          for script in fdroid/*.sh; do
            bash -n "$script"
          done
      - name: Verify release and Triple-T metadata
        run: fdroid/verify-metadata.sh

      - name: Run fdroiddata metadata, scanner, and production build tests
        run: fdroid/run-fdroiddata-tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroiddata-apk
          path: _/build/build/fdroiddata/
          if-no-files-found: error

  compare-source-builds:
    needs: [release-apk, fdroiddata-recipe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wegert-fdroid-unsigned
          path: direct
      - uses: actions/download-artifact@v4
        with:
          name: wegert-fdroiddata-apk
          path: buildserver
      - name: Require the independent buildserver APK to match the direct rebuild
        run: |
          set -euo pipefail
          source _/build/fdroid/release-values.sh
          direct="direct/wegert-$WEGERT_VERSION_NAME-fdroid-unsigned.apk"
          server="buildserver/org.isomorphisms.wegert_$WEGERT_VERSION_CODE.apk"
          sha256sum "$direct" "$server"
          cmp "$direct" "$server"
          echo 'PASS: two clean direct builds and the independent fdroiddata buildserver produced identical APK bytes' >> "$GITHUB_STEP_SUMMARY"
