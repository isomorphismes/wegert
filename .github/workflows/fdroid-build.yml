name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '.gitmodules'
      - '_deps/**'
      - 'android-direct/**'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - '*.o'
      - '*.sha256'
      - 'CMakeLists.txt'
      - 'app/src/main/res/**'
      - 'fastlane/**'
      - 'fdroid/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY.md'
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: wegert-fdroid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify release, licensing, and Fastlane metadata
        run: bash fdroid/verify-metadata.sh

      - name: Install source-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            chezscheme \
            cmake \
            libgmp-dev \
            python3 \
            unzip \
            zip

      - uses: android-actions/setup-android@v3

      - name: Install Android build inputs
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Build twice and require byte-identical direct APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          bash fdroid/reproducible-build.sh build/reproducible-fdroid

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroid-unsigned
          path: |
            build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk
            build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk.sha256
            build/reproducible-fdroid/run-*.classes.dex.sha256
            build/reproducible-fdroid/diffoscope.txt
          if-no-files-found: error

  fdroiddata-recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release, licensing, and Fastlane metadata
        run: bash fdroid/verify-metadata.sh

      - name: Run fdroiddata metadata, scanner, and production build tests
        run: bash fdroid/run-fdroiddata-tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroiddata-apk
          path: build/fdroiddata/
          if-no-files-found: error
