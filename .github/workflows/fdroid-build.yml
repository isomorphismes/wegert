name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '.github/workflows/ick-compilers.yml'
      - '_/build/icky/**'
      - 'code/**'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - '_/build/**'
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/fdroid-build.yml'
      - '.github/workflows/ick-compilers.yml'
      - '_/build/icky/**'
      - 'code/**'
      - '*.c'
      - '*.h'
      - '*.glsl'
      - '*.frag.in'
      - '_/build/**'
  workflow_dispatch:

concurrency:
  group: fdroid-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ick-compilers:
    uses: ./.github/workflows/ick-compilers.yml
  release-apk:
    needs: ick-compilers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check out the pinned owned C producer interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 66023d128a316cf9ab2c5146df60bb9fed82bb17
          path: _/ai-ci-ick
          persist-credentials: false
      - name: Download all qualified ICK ABI stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wegert-ick-*
          merge-multiple: true
          path: _/build/ick-packages
      - name: Restore checked producers at canonical build paths
        working-directory: ${{ github.workspace }}
        run: make -f _/build/icky/Restore.mk restore

      - name: Verify release and Triple-T metadata
        run: fdroid/verify-metadata.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build twice and require byte-identical unsigned APKs
        run: fdroid/reproducible-build.sh build/reproducible-fdroid

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroid-unsigned
          path: |
            _/build/build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk
            _/build/build/reproducible-fdroid/wegert-*-fdroid-unsigned.apk.sha256
            _/build/build/reproducible-fdroid/diffoscope.txt
          if-no-files-found: error

  fdroiddata-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: _/build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release and Triple-T metadata
        run: fdroid/verify-metadata.sh

      - name: Run fdroiddata metadata, scanner, and production build tests
        run: |
          mkdir -p build/fdroid-diagnostics
          fdroid/run-fdroiddata-tests.sh > build/fdroid-diagnostics/production.log 2>&1

      - name: Retain bounded production diagnostics
        if: always()
        run: |
          if test -f build/fdroid-diagnostics/production.log; then
            tail -n 200 build/fdroid-diagnostics/production.log
            gzip -c build/fdroid-diagnostics/production.log > build/fdroid-diagnostics/production.log.gz
          fi

      - name: Upload compressed production log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroid-production-log
          path: _/build/build/fdroid-diagnostics/production.log.gz
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: wegert-fdroiddata-apk
          path: _/build/build/fdroiddata/
          if-no-files-found: error
